[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persian-sea"
version = "0.4.1"
description = "Persian sign-language subtitle alignment with continuous video, Pose+RGB and BGE-M3"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2.0",
  "PyYAML>=6.0",
  "webvtt-py>=0.4.6",
  "pysrt>=1.1.2",
  "pose-format>=0.9.0",
  "torch>=2.2",
  "transformers>=4.56",
  "Pillow>=10",
  "decord>=0.6.0",
  "tqdm>=4.66"
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
persian-sea-pose = "persian_sea.cli.pose:main"
persian-sea-segment = "persian_sea.cli.segment:main"
persian-sea-validate-segments = "persian_sea.cli.validate_segments:main"
persian-sea-eval-segments = "persian_sea.cli.eval_segments:main"
persian-sea-tune-segments = "persian_sea.cli.tune_segments:main"
persian-sea-scan-rgbpose = "persian_sea.cli.scan_rgbpose:main"
persian-sea-inspect-cache = "persian_sea.cli.inspect_cache:main"
persian-sea-align = "persian_sea.cli.align:main"
persian-sea-audit-data = "persian_sea.cli.audit_data:main"
persian-sea-scan-text = "persian_sea.cli.scan_text:main"
persian-sea-train-semantic = "persian_sea.cli.train_semantic:main"
persian-sea-align-semantic = "persian_sea.cli.align_semantic:main"
persian-sea-eval-semantic = "persian_sea.cli.eval_semantic:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
